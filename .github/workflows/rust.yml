name: Linux

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            image: ubuntu:latest
          - name: Debian
            image: debian:stable
          - name: Fedora
            image: fedora:latest
          - name: Arch
            image: archlinux:latest
          - name: openSUSE
            image: opensuse/tumbleweed:latest
          - name: Alpine
            image: alpine:latest
          - name: Rocky
            image: rockylinux:9

    steps:
      - uses: actions/checkout@v4

      - name: Build in distro
        run: |
          docker run --rm \
            -v "$PWD:/orphfetch" \
            -w /orphfetch \
            "${{ matrix.image }}" \
            sh -c '
              echo "Testing ${{ matrix.name }}"

              if command -v apt-get >/dev/null; then
                apt-get update
                apt-get install -y curl build-essential pkg-config
              elif command -v dnf >/dev/null; then
                dnf install -y curl gcc gcc-c++ make pkg-config
              elif command -v pacman >/dev/null; then
                pacman -Sy --noconfirm
                pacman -S --noconfirm curl base-devel pkgconf
              elif command -v zypper >/dev/null; then
                zypper --non-interactive refresh
                zypper --non-interactive install curl gcc gcc-c++ make pkg-config
              elif command -v apk >/dev/null; then
                apk add --no-cache curl build-base pkgconf
              fi

              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal

              . "$HOME/.cargo/env"

              cargo check --all-targets
              cargo build --release
              cargo test
            '
